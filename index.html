<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Bản đồ thế giới</title>

    <link
        rel="stylesheet"
        href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    >

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- bảng điều khiển dữ liệu bên phải -->
    <aside id="country-panel" class="country-panel">

        <div class="panel-header">
            <h2 id="panel-country-name">Quốc gia</h2>

            <button
                id="close-panel"
                class="close-button"
                aria-label="Đóng bảng thông tin"
            >
                ×
            </button>
        </div>


        <div class="panel-content">

            <!-- Ngành công nghiệp người lớn -->
            <section class="panel-section">

                <h3>🔞 Ngành công nghiệp người lớn</h3>

                <p class="section-description">
                    Người biểu diễn nổi tiếng
                </p>

                <ul id="performers-list">
                    <li>Người biểu diễn mẫu 1</li>
                    <li>Người biểu diễn mẫu 2</li>
                    <li>Người biểu diễn mẫu 3</li>
                </ul>

            </section>


            <!-- Dân số -->
            <section class="panel-section">

                <h3>👥 Dân số</h3>

                <div class="data-row">
                    <span>Tổng dân số</span>
                    <strong id="population-total">
                        123,456,789
                    </strong>
                </div>

                <div class="data-row">
                    <span>Nam</span>
                    <strong id="population-male">
                        49%
                    </strong>
                </div>

                <div class="data-row">
                    <span>Nữ</span>
                    <strong id="population-female">
                        51%
                    </strong>
                </div>

            </section>


            <!-- Sinh sản và tình dục -->
            <section class="panel-section">

                <h3>👶 Sinh sản và tình dục</h3>

                <div class="data-row">
                    <span>Số con trung bình / phụ nữ</span>
                    <strong id="birth-rate">
                        XX
                    </strong>
                </div>

                <div class="data-row">
                    <span>Hoạt động tình dục</span>
                    <strong id="sexual-activity">
                        XX
                    </strong>
                </div>

            </section>

        </div>

    </aside>


    <!-- bản đồ của bên thứ -->
    <main id="map"></main>


    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <script type="module" src="src/main.js"></script>

</body>
</html>
